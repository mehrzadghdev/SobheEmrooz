<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#da1214">
  <title>اتصال اینترنت · صبح امروز</title>
  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pwa.css') }}">
  <script src="{{ url_for('static', filename='js/pwa.js') }}" data-worker-url="{{ url_for('pwa.service_worker') }}" data-scope="{{ url_for('web.dashboard') }}" defer></script>
</head>
<body class="pwa-offline-page">
  <main class="card pwa-offline-card">
    <img src="{{ url_for('static', filename='icons/icon-192.png') }}" width="88" height="88" alt="صبح امروز">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای مشاهده گزارش‌ها و ثبت تغییرات، اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</p>
    <div class="actions">
      <button type="button" data-pwa-retry>تلاش دوباره</button>
      <a class="button secondary" href="{{ url_for('web.dashboard') }}">صفحه اصلی</a>
    </div>
  </main>
</body>
</html>
