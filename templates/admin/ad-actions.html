{% from 'partials/icons.html' import icon %}
<div class="row-actions"><a class="icon-action" href="{{ url_for('web.admin_ad_detail',ad_id=ad.id) }}" title="مشاهده" aria-label="مشاهده آگهی {{ ad.ma_reference }}">{{ icon('view') }}</a>{% if g.user.role == 'admin' %}<a class="icon-action" href="{{ url_for('web.ad_edit',ad_id=ad.id) }}" title="ویرایش" aria-label="ویرایش آگهی {{ ad.ma_reference }}">{{ icon('edit') }}</a><button type="button" class="icon-action secondary danger-action" data-delete-ad data-delete-url="{{ url_for('web.ad_void',ad_id=ad.id) }}" data-ad-version="{{ ad.version }}" data-ad-reference="{{ ad.ma_reference }}" title="حذف" aria-label="حذف آگهی {{ ad.ma_reference }}" aria-haspopup="dialog">{{ icon('delete') }}</button>{% endif %}</div>
