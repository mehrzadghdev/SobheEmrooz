<form class="period-controls no-print" method="get">
  {% if request.endpoint == 'web.reports' %}<input type="hidden" name="view" value="{{ view }}">{% endif %}
  <label for="period-year">سال شمسی<input id="period-year" name="year" inputmode="numeric" value="{{ selected.year }}" required maxlength="4"></label>
  <label for="period-half">دوره شش‌ماهه<select id="period-half" name="half"><option value="1" {{ 'selected' if selected.half == 1 }}>نیمه اول · فروردین تا شهریور</option><option value="2" {{ 'selected' if selected.half == 2 }}>نیمه دوم · مهر تا اسفند</option></select></label>
  <button class="secondary">نمایش دوره</button>
</form>
